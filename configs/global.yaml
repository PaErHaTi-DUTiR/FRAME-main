seed: 42

paths:
  datasets_root: datasets
  processed_root: sample_data
  outputs_root: outputs

runner:
  method: karve

# Backend credentials are read from the provider's environment variable
# (DEEPSEEK_API_KEY / OPENAI_API_KEY / QWEN_API_KEY) if `api_key` is left
# blank here — see model/backbones/factory.py. Never commit a real key.
backend:
  mode: real
  provider: deepseek
  model_name: deepseek-chat
  api_key: ""
  base_url: https://api.deepseek.com
  deterministic: true
  seed: 42
  temperature: 0.0
  max_tokens: 1024

pipeline:
  retrieval_enabled: true
  alignment_enabled: true
  verification_enabled: true
  reflection_enabled: true

splits:
  train: train
  eval: test

limits:
  max_samples_per_language: null
  low_resource_ratio: 1.0
